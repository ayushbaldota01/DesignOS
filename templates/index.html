<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DesignOS — Edit Mode</title>
  <!-- Monaco Editor CDN -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
  <!-- Three.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
  <link rel="stylesheet" href="/static/ide.css">
</head>
<body>
  <!-- HEADER -->
  <header class="ide-header">
    <span class="logo">⬡ DESIGNOS</span>
    <span class="mode-indicator" id="modeIndicator">FORM MODE</span>
    <div class="header-right">
      <span id="runStatus" class="run-status"></span>
      <button id="toggleScript" class="btn-secondary" style="display:none">Show Script</button>
      <button id="downloadBtn" class="btn-secondary" style="display:none">↓ STEP</button>
    </div>
  </header>

  <!-- STAGE 1: FORM MODE -->
  <div id="formStage" class="stage">
    <!-- From existing index.html -->
    <aside id="sidebar" style="width: 340px; border-right: 1px solid var(--border); overflow-y: auto;">
      <div id="ai-panel">
        <div class="panel-section">
          <h2>Part Definition</h2>
          <label for="part-type">Part Type</label>
          <select id="part-type" style="width:100%; padding: 8px; margin-bottom: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
            <option value="Bracket">Bracket</option>
            <option value="Plate">Plate</option>
            <option value="Shaft">Shaft</option>
            <option value="Beam">I-Beam</option>
            <option value="Housing">Housing</option>
            <option value="Gear">Gear</option>
            <option value="Flange">Flange</option>
            <option value="Custom">Custom</option>
          </select>
        </div>
        <div class="panel-section">
          <h2>Dimensions (mm)</h2>
          <div class="dim-row" style="display:flex; gap: 8px;">
            <div style="flex:1;"><label for="dim-l">Length</label><input type="number" id="dim-l" value="100" style="width:100%; padding:6px; background:var(--bg); border:1px solid var(--border); color:var(--text);" /></div>
            <div style="flex:1;"><label for="dim-w">Width</label><input type="number" id="dim-w" value="60" style="width:100%; padding:6px; background:var(--bg); border:1px solid var(--border); color:var(--text);" /></div>
            <div style="flex:1;"><label for="dim-h">Height</label><input type="number" id="dim-h" value="20" style="width:100%; padding:6px; background:var(--bg); border:1px solid var(--border); color:var(--text);" /></div>
          </div>
        </div>
        <div class="panel-section">
          <h2>Features</h2>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <label><input type="checkbox" id="feat-holes" checked /> Holes</label>
            <label><input type="checkbox" id="feat-fillets" checked /> Fillets</label>
            <label><input type="checkbox" id="feat-chamfers" /> Chamfers</label>
            <label><input type="checkbox" id="feat-pockets" /> Pockets</label>
            <label><input type="checkbox" id="feat-shell" /> Shell</label>
            <label><input type="checkbox" id="feat-boss" /> Boss</label>
          </div>
        </div>
        <div class="panel-section">
          <h2>Material</h2>
          <select id="material" style="width:100%; padding: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border);">
            <option value="Steel">Steel</option>
            <option value="Aluminium" selected>Aluminium</option>
            <option value="PLA">PLA (3D Print)</option>
          </select>
        </div>
        <div class="panel-section">
          <h2>Custom Notes</h2>
          <input type="text" id="notes" placeholder="e.g. Add 4 M6 holes" style="width:100%; padding:8px; background:var(--bg); border:1px solid var(--border); color:var(--text);" />
        </div>
        <div class="panel-section">
          <button class="btn-primary" id="btn-generate" style="width:100%; padding: 12px; background: var(--accent); color: #000; border:none; font-weight:bold; cursor:pointer;">▶ GENERATE</button>
        </div>
      </div>
    </aside>
    <main style="flex:1; display:flex; flex-direction:column; padding: 20px;">
      <h2 style="font-size:12px; color:var(--accent); margin-bottom: 12px; letter-spacing:1px;">GENERATION LOG</h2>
      <div id="log-entries" style="flex:1; border:1px solid var(--border); background:#151515; padding: 16px; font-family: monospace; overflow-y:auto; font-size: 11px;">
        <div style="color:var(--text-dim);">Waiting for generation...</div>
      </div>
    </main>
  </div>

  <!-- STAGE 2: EDIT MODE (hidden until generation complete) -->
  <div id="editStage" class="stage" style="display:none">
    <div class="edit-layout">
      
      <!-- LEFT: Sliders -->
      <div class="slider-panel" id="sliderPanel">
        <div class="panel-title">PARAMETERS</div>
        <div id="slidersContainer"></div>
        <button class="btn-back" id="backBtn">← New Part</button>
      </div>

      <!-- CENTER: 3D Viewer -->
      <div class="viewer-panel">
        <canvas id="viewerCanvas"></canvas>
        <!-- Face click popup -->
        <div id="facePopup" class="face-popup" style="display:none">
          <div class="popup-title" id="popupTitle">TOP FACE</div>
          <button onclick="faceAction('Add holes here')">+ Holes</button>
          <button onclick="faceAction('Add pocket here')">+ Pocket</button>
          <button onclick="faceAction('Add fillet to all edges')">+ Fillet</button>
          <button onclick="faceAction('Add boss here')">+ Boss</button>
          <button class="btn-close" onclick="closePopup()">✕</button>
        </div>
      </div>

      <!-- RIGHT: Script (hidden by default) -->
      <div class="script-panel" id="scriptPanel" style="display:none">
        <div class="panel-title" style="padding:16px;">SCRIPT</div>
        <div id="monacoEditor" style="height:100%"></div>
      </div>

    </div>

    <!-- BOTTOM: AI Chat -->
    <div class="ai-panel">
      <span class="ai-label">AI ›</span>
      <input type="text" id="aiInput" class="ai-input" 
             placeholder='e.g. "add 4 M6 holes on top face" or "increase wall thickness"'/>
      <button id="aiBtn" class="btn-assist">MODIFY</button>
      <span id="aiStatus" class="ai-status"></span>
    </div>
  </div>

<script type="module">
import { CADViewer } from "/static/viewer.js";
window.viewerInstance = new CADViewer("viewerCanvas");

let currentJobId = null;
let pollTimer = null;
let lastLogLen = 0;

const partTypeSelect = document.getElementById("part-type");
const labelL = document.querySelector('label[for="dim-l"]');
const labelW = document.querySelector('label[for="dim-w"]');
const labelH = document.querySelector('label[for="dim-h"]');
const containerW = document.getElementById('dim-w').parentElement;
const containerH = document.getElementById('dim-h').parentElement;

partTypeSelect.addEventListener("change", () => {
  const t = partTypeSelect.value;
  containerW.style.display = "block";
  containerH.style.display = "block";
  labelL.textContent = "Length";
  labelW.textContent = "Width";
  labelH.textContent = "Height";

  if (t === "Shaft") {
    labelL.textContent = "Total Length";
    labelW.textContent = "Stage 1 Dia.";
    labelH.textContent = "Stage 2 Dia.";
  } else if (t === "Gear") {
    labelL.textContent = "Diameter";
    containerW.style.display = "none";
    labelH.textContent = "Thickness";
  } else if (t === "Bracket") {
    labelL.textContent = "Base Length";
    labelW.textContent = "Width";
    labelH.textContent = "Height";
  }
});

document.getElementById('btn-generate').addEventListener('click', async () => {
    document.getElementById('btn-generate').disabled = true;
    document.getElementById('log-entries').innerHTML = '';
    
    const feats = [];
    if (document.getElementById("feat-holes").checked) feats.push("mounting holes");
    if (document.getElementById("feat-fillets").checked) feats.push("filleted edges");
    if (document.getElementById("feat-chamfers").checked) feats.push("chamfered edges");
    if (document.getElementById("feat-pockets").checked) feats.push("pockets / cutouts");
    if (document.getElementById("feat-shell").checked) feats.push("hollow shell");
    if (document.getElementById("feat-boss").checked) feats.push("bosses / standoffs");
    
    const payload = {
        part_type: partTypeSelect.value,
        length: parseFloat(document.getElementById('dim-l').value) || 100,
        width: parseFloat(document.getElementById('dim-w').value) || 60,
        height: parseFloat(document.getElementById('dim-h').value) || 20,
        material: document.getElementById('material').value,
        features: feats,
        notes: document.getElementById('notes').value
    };
    
    const res = await fetch('/generate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });
    const d = await res.json();
    currentJobId = d.job_id;
    pollTimer = setInterval(pollStatus, 800);
});

async function pollStatus() {
    const res = await fetch(`/status/${currentJobId}`);
    const d = await res.json();
    
    // update logs
    if (d.log.length > lastLogLen) {
        for (let i = lastLogLen; i < d.log.length; i++) {
            const div = document.createElement('div');
            div.textContent = `> ${d.log[i].message}`;
            document.getElementById('log-entries').appendChild(div);
        }
        lastLogLen = d.log.length;
    }
    
    if (d.status === 'completed') {
        clearInterval(pollTimer);
        // Let's transition to edit mode!
        onGenerationComplete(currentJobId, d.script || "");
    } else if (d.status === 'failed') {
        clearInterval(pollTimer);
        document.getElementById('btn-generate').disabled = false;
        alert("Generation failed: " + d.error);
    }
}

function onGenerationComplete(jobId, script) {
    window.currentScript = script;
    window.currentJobId = jobId;
    
    document.getElementById('formStage').style.display = 'none';
    document.getElementById('editStage').style.display = 'flex';
    document.getElementById('modeIndicator').textContent = 'EDIT MODE';
    document.getElementById('downloadBtn').style.display = 'block';
    document.getElementById('toggleScript').style.display = 'block';
    
    window.viewerInstance.loadSTL(`/model/${jobId}`);
    
    const params = parseSliders(script);
    buildSliders(params, onSliderChange);
    initMonaco(script);
}

document.getElementById('downloadBtn').addEventListener('click', () => {
    window.location.href = `/download/${window.currentJobId}`;
});

document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('editStage').style.display = 'none';
    document.getElementById('formStage').style.display = 'flex';
    document.getElementById('modeIndicator').textContent = 'FORM MODE';
    document.getElementById('downloadBtn').style.display = 'none';
    document.getElementById('toggleScript').style.display = 'none';
    document.getElementById('btn-generate').disabled = false;
    window.viewerInstance.clear();
});

window.runCurrentScript = async function() {
    document.getElementById('runStatus').textContent = 'Running...';
    document.getElementById('runStatus').className = 'run-status running';
    
    const script = window.monacoInstance ? window.monacoInstance.getValue() : window.currentScript;
    const res = await fetch('/run-script', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({script})
    });
    const d = await res.json();
    
    let execTimer = setInterval(async () => {
        const sr = await fetch(`/status/${d.job_id}`);
        const stat = await sr.json();
        if (stat.status === 'completed') {
            clearInterval(execTimer);
            document.getElementById('runStatus').textContent = 'Updated';
            document.getElementById('runStatus').className = 'run-status done';
            window.currentJobId = d.job_id;
            window.viewerInstance.loadSTL(`/model/${d.job_id}`);
        } else if (stat.status === 'failed') {
            clearInterval(execTimer);
            document.getElementById('runStatus').textContent = 'Error';
            document.getElementById('runStatus').className = 'run-status error';
        }
    }, 800);
}
</script>

<script src="/static/sliders.js"></script>
<script src="/static/editor.js"></script>
<script>
async function triggerAI() {
    const instruction = document.getElementById('aiInput').value.trim();
    if (!instruction) return;
    
    const script = window.monacoInstance ? window.monacoInstance.getValue() : window.currentScript;
    
    document.getElementById('aiStatus').textContent = 'Thinking...';
    document.getElementById('aiBtn').disabled = true;
    
    const res = await fetch('/assist', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            instruction,
            script,
            face_normal: window.clickedFaceNormal || null,
            face_label: window.clickedFaceLabel || null
        })
    });
    
    const data = await res.json();
    
    if (data.script) {
        window.currentScript = data.script;
        if (window.monacoInstance) {
            window.monacoInstance.setValue(data.script);
        }
        buildSliders(parseSliders(data.script), onSliderChange);
        await runCurrentScript();
    }
    
    document.getElementById('aiStatus').textContent = '';
    document.getElementById('aiBtn').disabled = false;
    document.getElementById('aiInput').value = '';
}

document.getElementById('aiBtn').addEventListener('click', triggerAI);
document.getElementById('aiInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') triggerAI();
});

function faceAction(action) {
    closePopup();
    document.getElementById('aiInput').value = `${action} on the ${window.clickedFaceLabel.toLowerCase()}`;
    triggerAI();
}

function closePopup() {
    document.getElementById('facePopup').style.display = 'none';
}
window.faceAction = faceAction;
window.closePopup = closePopup;
</script>
</body>
</html>
